# Abstract tests of conformance class JSON (OGC 19-072, Annex A.4).
#
# This building block's schema (schema.yaml) is the JSON payload of the Landing Page and Conformance
# resources (landingPage.yaml / confClasses.yaml), so the postprocessor validates every JSON test
# resource below against it - which is exactly what /conf/json/content prescribes. Resources whose
# name ends in "-fail" are negative tests: they must NOT validate.
#
# The test method shown for a requirement in the Abstract Test Suite is the one of its first test;
# the other entries only add test resources.

- id: conf/json/definition
  ref: ../../test-resources/landing-page.json
  output-filename: conf-json-definition-landing-page.json
  method: |
    **Abstract test A.18** — `/conf/json/definition` (subject: `/req/json/definition`,
    `/req/json/content`)

    **Test purpose:** Verify support for JSON

    **Test method:**

    ```text
    DO FOR EACH resource and operation defined in the Landing Page Conformance Class:
      1. Execute the operation specifying application/json as the media type
      2. Validate that a document was returned with a status code 200
      3. Validate the contents of the returned document using test /conf/json/content.
    DONE
    ```

- id: conf/json/definition-conformance
  ref: ../../test-resources/conformance.json
  output-filename: conf-json-definition-conformance.json

- id: conf/json/content
  ref: ../../test-resources/landing-page.json
  output-filename: conf-json-content-landing-page.json
  method: |
    **Abstract test A.19** — `/conf/json/content`

    **Test purpose:** Verify the content of a JSON document given an input document and schema.

    **Test method:**

    1. Validate that the document is a JSON (IETF RFC 8259) document.
    2. Validate the document against the schema using a JSON Schema validator.

- id: conf/json/content-conformance
  ref: ../../test-resources/conformance.json
  output-filename: conf-json-content-conformance.json

- id: conf/json/content-landing-page-no-links
  ref: ../../test-resources/landing-page-no-links-fail.json
  output-filename: conf-json-content-landing-page-no-links-fail.json
  require-fail: true

- id: conf/json/content-conformance-not-a-list
  ref: ../../test-resources/conformance-not-a-list-fail.json
  output-filename: conf-json-content-conformance-not-a-list-fail.json
  require-fail: true
