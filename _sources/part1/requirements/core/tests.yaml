# Abstract tests of conformance class Core (OGC 19-072, Annex A.2).
#
# One entry per abstract test: 'id' is the abstract test identifier (referenced from 'tested-by' in
# requirements.yaml), 'method' is the test purpose and method of OGC 19-072, rendered in the generated
# Abstract Test Suite (Annex A).
#
# Every test of this class is executed against the operations and query parameters advertised in the
# API definition of the server, so the test resource is an example API definition (OGC 19-072, Annex B.3).
# 'output-filename' keeps the validation outputs of the entries apart, since they share the same resource.

- id: conf/core/http
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-http.yaml
  method: |
    **Abstract test A.1** — `/conf/core/http`

    **Test purpose:** Validate that the resources advertised through the API can be accessed using the
    HTTP 1.1 protocol and, where appropriate, TLS.

    **Test method:**

    1. All compliance tests shall be configured to use the HTTP 1.1 protocol exclusively.
    2. For APIs that support HTTPS, all compliance tests shall be configured to use HTTP over TLS
       (RFC 2818) with their HTTP 1.1 protocol.

- id: conf/core/query-param-name-unknown
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-name-unknown.yaml
  method: |
    **Abstract test A.2** — `/conf/core/query-param-name-unknown`

    **Test purpose:** Validate that an error is returned when a query parameter is used that has not
    been specified in the API definition.

    **Test method:**

    ```text
    DO FOR ALL operations advertised in the API definition
      1. Execute that operation using a query parameter that is not specified in the API definition.
      2. Validate that the operation returns a response with the status code 400.
    DONE
    ```

    NOTE 1: The parameter name chosen should not fall within the range allowed by
    `/per/core/query-param-name-specified` or `/per/core/query-param-name-tolerance`.

- id: conf/core/query-param-value-invalid
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-value-invalid.yaml
  method: |
    **Abstract test A.3** — `/conf/core/query-param-value-invalid`

    **Test purpose:** Validate that an error is returned when a query parameter contains a value that
    is not valid for that parameter.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition
      DO FOR ALL operations for which that parameter is valid
        1. Execute that operation using the query parameter with values
           that do not comply with the advertised constraints on those values.
           (Example: exceeding minimum or maximum values)
        2. Validate that the operation returns a response with the status code 400.
      DONE
    DONE
    ```

    NOTE 2: The parameter values chosen should not fall within the range allowed by
    `/per/core/query-param-value-specified` or `/per/core/query-param-value-tolerance`.

- id: conf/core/query-param-capitalization
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-capitalization.yaml
  method: |
    **Abstract test A.4** — `/conf/core/query-param-capitalization`

    **Test purpose:** Validate that a parameter name is correctly capitalized

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition
      DO FOR ALL operations for which that parameter is valid
        1. Execute that operation using that query parameter
           capitalized as specified in the API definition
        2. Validate that the operation returns a response with the status code 200.
        3. Execute that operation using that query parameter with capitalization
           inverse of that specified in the API definition
           (Example: "Range" vs. "rANGE")
        4. Validate that the operation returns a response with the status code 400.
      DONE
    DONE
    ```

- id: conf/core/query-param-list-delimiter
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-list-delimiter.yaml
  method: |
    **Abstract test A.5** — `/conf/core/query-param-list-delimiter`

    **Test purpose:** For every query parameter where the value may be a list, validate that the
    server uses the designated delimiter to parse the items from the list.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value can be a list
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and a value that is a delimited
           list of items. Use a delimiter that is:
             a. As advertised in the API definition OR
             b. A comma (",") if no delimiter is advertised.
        2. Validate that the server properly interprets that parameter value
        3. Generate a request using that parameter and a value where:
             a. the value is a delimited list AND
             b. the delimiter used to construct the list is not valid for this server
        4. Validate that the server returns a status code 400
      DONE
    DONE
    ```

- id: conf/core/query-param-list-escape
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-list-escape.yaml
  method: |
    **Abstract test A.6** — `/conf/core/query-param-list-escape`

    **Test purpose:** For every query parameter where the value may be a list, validate that all
    escaped space and comma characters that appear in the values are properly processed.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value can be a list
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and a value that
           includes an escaped space or comma
        2. Validate that the server properly interprets that parameter value
        3. Generate a request using that parameter and a value that
           includes a non-escaped space or comma
        4. Validate that the server returns a status code 400
      DONE
    DONE
    ```

- id: conf/core/query-param-list-empty
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-list-empty.yaml
  method: |
    **Abstract test A.7** — `/conf/core/query-param-list-empty`

    **Test purpose:** For every query parameter where the value may be a list, validate that the
    server interprets an empty string as an empty list.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value can be a list
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and an empty string for the parameter value.
        2. Validate that the server properly interprets that parameter value as an empty list
      DONE
    DONE
    ```

- id: conf/core/query-param-value-boolean
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-value-boolean.yaml
  method: |
    **Abstract test A.8** — `/conf/core/query-param-value-boolean`

    **Test purpose:** For every query parameter where the value is a boolean, validate that the server
    correctly interprets boolean values of “true” and “false”.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value is a boolean
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and the string "true" for the parameter value
        2. Validate that the server properly interprets that parameter value as true boolean value
        3. Generate a request using that parameter and the string "false" for the parameter value
        4. Validate that the server properly interprets that parameter value as false boolean value
      DONE
    DONE
    ```

- id: conf/core/query-param-value-integer
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-value-integer.yaml
  method: |
    **Abstract test A.9** — `/conf/core/query-param-value-integer`

    **Test purpose:** For every query parameter where the value is an integer, validate that the
    server correctly interprets properly encoded integer values.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value is an integer
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and an unsigned numeric string for the parameter value
        2. Validate that the server properly interprets that parameter value as an unsigned integer
        3. Generate a request using that parameter and a negative signed numeric string for the parameter value
        4. Validate that the server properly interprets that parameter value as a signed negative integer value
      DONE
    DONE
    ```

- id: conf/core/query-param-value-decimal
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-value-decimal.yaml
  method: |
    **Abstract test A.10** — `/conf/core/query-param-value-decimal`

    **Test purpose:** For every query parameter where the value is a decimal, validate that the server
    correctly interprets properly encoded decimal values.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value is a decimal number
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and a parameter value that is:
             a) an unsigned numeric string preceded by one or more zeros
             b) contains at least two factional digits followed by one or more zeros
        2. Validate that the server properly interprets that parameter value as an unsigned decimal value
        3. Generate a request using that parameter and a parameter value that is:
             a) a signed negative numeric string
             b) contains at least two factional digits followed by one or more zeros
        4. Validate that the server properly interprets that parameter value as a signed negative decimal value
        5. Generate a request using that parameter and a parameter value that:
             a) is an unsigned numeric string preceded by one or more zeros
             b) does not contain non-numeric characters (".")
        6. Validate that the server properly interprets that parameter value as an unsigned decimal value
           with a fractional value of zero
      DONE
    DONE
    ```

- id: conf/core/query-param-value-double
  ref: ../../test-resources/api-definition.yaml
  output-filename: conf-core-query-param-value-double.yaml
  method: |
    **Abstract test A.11** — `/conf/core/query-param-value-double`

    **Test purpose:** For every query parameter where the value is a double, validate that the server
    correctly interprets properly encoded double values.

    **Test method:**

    ```text
    DO FOR ALL query parameters advertised in the API definition where the parameter value is a double value
      DO FOR ALL operations for which that parameter is valid
        1. Generate a request using that parameter and a parameter value that is:
             a) greater than 4,294,967,296 ("e" and exponent required) and
             b) contains at least two factional digits followed by one or more zeros
        2. Validate that the server properly interprets that parameter value
        3. Generate a request using that parameter and a parameter value that is:
             a) less than -4,294,967,296 (without "e" and exponent) and
             b) contains at least two factional digits followed by one or more zeros
        4. Validate that the server properly interprets that parameter value
        5. Generate a request using that parameter and a parameter value that is:
             a) Less than 4,294,967,296
             b) Greater than -4,294,967,295
             c) Represented as a single decimal number
        6. Validate that the server properly interprets that parameter value
      DONE
    DONE
    ```
