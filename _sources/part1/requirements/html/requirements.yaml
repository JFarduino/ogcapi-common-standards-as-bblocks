# Requirements class: HTML  (OGC 19-072, clause 10.2 - Requirements class 3)
# Class URI:       http://www.opengis.net/spec/ogcapi-common-1/1.0/req/html
# Conformance URI: http://www.opengis.net/spec/ogcapi-common-1/1.0/conf/html
#
# Requirements 18-19 of OGC 19-072. Recommendation 17 is in description.md.

class-id: html
standardization-target: Web API

depends-on:
  # Prerequisites of requirements class 3 and conformance class A.4 (HTML)
  - bblock: ogc.api.common.part1.requirements.core
  - bblock: ogc.api.common.part1.requirements.landing-page
  - uri: http://www.w3.org/TR/html5/
    title: HTML5
  - uri: http://schema.org/docs/schemas.html
    title: Schema.org

requirements:

  # Requirement 18
  - id: html/definition
    level: SHALL
    statement: |
      **A.** 200-responses of the server SHALL support the `text/html` media type for the Landing Page
      and Conformance resources.
    tested-by:
      - conf/html/definition

  # Requirement 19
  - id: html/content
    level: SHALL
    statement: |
      **A.** Every 200-response of the API with the media type “text/html” SHALL be a
      [HTML 5 document](https://www.w3.org/TR/html5/) that includes the following information in the
      HTML body:

      - All information identified in the schemas of the
        [Response Object](https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.3.md#responseObject)
        in the HTML `<body/>`, and
      - All links in HTML `<a/>` elements in the HTML `<body/>`.
    tested-by:
      - conf/html/content
