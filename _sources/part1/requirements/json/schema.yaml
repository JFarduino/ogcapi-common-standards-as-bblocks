$schema: https://json-schema.org/draft/2020-12/schema
title: JSON payload of the Landing Page requirements class resources
description: >-
  /req/json/content (OGC 19-072): the JSON payload of a Landing Page or Conformance resource SHALL
  conform with the JSON Schema specified for the resource in the Landing Page Requirements Class, i.e.
  landingPage.yaml for the Landing Page and confClasses.yaml for the Conformance Declaration.
  The test resources of the JSON requirements class are validated against this schema.
anyOf:
  - $ref: bblocks://ogc.api.common.part1.schemas.landingPage
  - $ref: bblocks://ogc.api.common.part1.schemas.confClasses
