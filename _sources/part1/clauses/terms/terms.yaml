# Clause 4 - Terms and definitions (rendered sorted alphabetically, which is also the order of OGC 19-072).
# "Note N to entry" texts are part of the definition (the 'note' field is rendered as an editor's note).
# Abbreviated terms are clause 5 of OGC 19-072: they are kept in their own clause
# (clauses/abbreviated-terms) so that the clause numbering of the Standard is preserved.
terms:
  - term: Kebab case
    definition: >-
      A case style where punctuation is removed and spaces are replaced by single hyphens. All letters
      are in lower case when used in OGC documentation. Example: <code>kebab-case-style</code>
    sources:
      - title: Wikipedia
        uri: https://en.wikipedia.org/wiki/Letter_case

  - term: Landing Page
    definition: >-
      Any page whose primary purpose is to contain a description of something else.
      <br><em>Note 1 to entry:</em> Landing pages often provide summaries or additional information
      about the thing that they describe. Examples are landing pages for images on Flickr or videos on
      YouTube, which are HTML pages that embed the media that they describe and provide access to
      comments and other metadata about it. Landing pages for documents are often tables of contents
      or abstracts.
      <br><em>Note 2 to entry:</em> A landing page for a Web API serves as the root node of the API
      Resource tree and provides the information needed to navigate all the resources exposed through
      the API.
    sources:
      - title: W3C, URLs in Data Primer
        uri: https://www.w3.org/TR/urls-in-data/

  - term: OGC Web API
    definition: >-
      A Web API that implements one or more Conformance Classes from an OGC API Standard.

  - term: Representation
    definition: >-
      the current or intended state of a resource encoded for exchange between components.
    sources:
      - title: based on Fielding 2000
        uri: https://www.ics.uci.edu/~fielding/pubs/dissertation/fielding_dissertation.pdf

  - term: Resource
    definition: >-
      entity that might be identified.
      <br><em>Note 1 to entry:</em> The term “resource”, when used in the context of an OGC Web API
      standard, should be understood to mean a Web Resource unless otherwise indicated.
    sources:
      - title: Dublin Core Metadata Initiative — DCMI Metadata Terms
        uri: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/

  - term: Resource Type
    definition: >-
      a type of resource.
      <br><em>Note 1 to entry:</em> Resource types are re-usable components that are independent of
      where the resource resides in the API.

  - term: Uniform Resource Identifier (URI)
    definition: >-
      an identifier consisting of a sequence of characters matching the syntax rule named “&lt;URI&gt;”.
    sources:
      - title: IETF RFC 3986
        uri: https://www.rfc-editor.org/info/rfc3986

  - term: Uniform Resource Locator (URL)
    definition: >-
      the subset of URIs that, in addition to identifying a resource, provide a means of locating the
      resource by describing its primary access mechanism (e.g., its network “location”).
    sources:
      - title: IETF RFC 3986
        uri: https://www.rfc-editor.org/info/rfc3986

  - term: Web API
    definition: >-
      API using an architectural style that is founded on the technologies of the Web.
    sources:
      - title: W3C Data on the Web Best Practices
        uri: https://www.w3.org/TR/dwbp/

  - term: Web Resource
    definition: >-
      a resource that is identified by a URI.
