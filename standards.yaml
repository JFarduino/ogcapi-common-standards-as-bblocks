    modspec:
      singular-labels: true     # "Prerequisite" when there is only one, as in OGC 19-072
      obligation-row: false     # 19-072's requirements class tables have no "Obligation" row

    base-uri: http://www.opengis.net/spec/ogcapi-common-1/1.0
